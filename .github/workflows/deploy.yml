# =============================================================================
# Build, push and deploy (Session 13, D8).
#
#   trigger  CI succeeded for a push to main (workflow_run), or a manual run
#            with an optional commit `sha` (rollback = dispatch an older sha).
#   build    both images for linux/amd64 (the droplet's arch) with Buildx + GHA
#            cache → GHCR, tagged <full sha> and `latest`.
#   deploy   one SSH command, `deploy <sha>`. The droplet's authorized_keys
#            pins this key to a forced command (/opt/visorfans/bin/deploy-gate,
#            `restrict`): the key can run deploy.sh with a validated sha and
#            nothing else — no shell, no forwarding, no other command. The
#            host key is pinned (DEPLOY_KNOWN_HOSTS); there is no
#            StrictHostKeyChecking=no anywhere. The droplet pulls from GHCR
#            with its own read-only token — CI never sends one.
#   smoke    scripts/smoke.ts against production; a failure turns the run red
#            (deploy.sh has already rolled back if health checks failed).
#
# Every third-party action is pinned by commit SHA (tag in the comment).
#
# Environment `production` holds:
#   secrets  DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS,
#            SENTRY_AUTH_TOKEN (optional — source-map upload)
#   vars     APP_URL, API_URL, NEXT_PUBLIC_MEDIA_ORIGIN, NEXT_PUBLIC_SENTRY_DSN,
#            SENTRY_ORG, SENTRY_PROJECT_WEB (optional) — none of these is secret
# =============================================================================
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (default: the head of main)'
        required: false
        type: string

# Least privilege: read-only by default. Only `build` (which pushes to GHCR)
# gets `packages: write`; `deploy` and `smoke` never can.
permissions:
  contents: read

# One deploy at a time, and never cancel one half-way (a cancelled run could
# leave a migration applied with the old code still serving).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and push images
    # Only a green CI run for a PUSH to main (never a fork's pull request).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve the commit to deploy
        id: pick
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${RUN_SHA:-$GITHUB_SHA}}"
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::not a commit sha"; exit 1
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pick.outputs.ref }}
          persist-credentials: false

      - name: Full sha and image names
        id: target
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "sha=$sha"
            echo "api=ghcr.io/$owner/creator-platform-api"
            echo "web=ghcr.io/$owner/creator-platform-web"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.target.outputs.api }}:${{ steps.target.outputs.sha }}
            ${{ steps.target.outputs.api }}:latest
          build-args: |
            GIT_SHA=${{ steps.target.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.target.outputs.web }}:${{ steps.target.outputs.sha }}
            ${{ steps.target.outputs.web }}:latest
          # NEXT_PUBLIC_* are public by definition and inlined at build time.
          build-args: |
            GIT_SHA=${{ steps.target.outputs.sha }}
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ vars.NEXT_PUBLIC_MEDIA_ORIGIN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_WEB=${{ vars.SENTRY_PROJECT_WEB }}
          # A BuildKit secret mount, never a build arg or an image layer.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to the droplet
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: deploy <sha> over the forced-command key
        env:
          SHA: ${{ needs.build.outputs.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          # StrictHostKeyChecking=yes + a pinned known_hosts: an unknown or
          # changed host key aborts the deploy instead of being trusted.
          ssh -i "$dir/key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            "deploy@${DEPLOY_HOST}" "deploy ${SHA}"

  smoke:
    name: Smoke test production
    needs: [build, deploy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: scripts/smoke.ts
        env:
          APP_URL: ${{ vars.APP_URL }}
          API_URL: ${{ vars.API_URL }}
        run: node --experimental-strip-types scripts/smoke.ts --app-url "$APP_URL" --api-url "$API_URL"
